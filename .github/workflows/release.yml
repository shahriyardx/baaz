name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Verify extension version matches tag
        run: |
          EXT=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          [ "$EXT" = "$TAG" ] || { echo "extension/manifest.json is $EXT but tag is $TAG"; exit 1; }
      - name: Build
        run: |
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME#v}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="$LDFLAGS" -o "baaz-${os}-${arch}" ./cmd/baaz
          done
      - name: Check macOS binaries against XProtect adware signature
        run: |
          ./macos/xprotect-check.sh baaz-darwin-amd64
          ./macos/xprotect-check.sh baaz-darwin-arm64
      - name: Test
        run: go test ./...
      - name: Package the extension for manual install
        # macOS Chrome refuses to install a local .crx, so the extension also
        # ships as the plain unpacked folder for "Load unpacked". Same bytes
        # the binary embeds — extension/ is the single source.
        run: |
          rm -rf baaz-extension
          cp -r extension baaz-extension
          zip -qr baaz-extension.zip baaz-extension
          rm -rf baaz-extension
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            baaz-linux-*
            baaz-darwin-*
            baaz-extension.zip

  macos-app:
    # macos-14 ships Swift 5.10, which is far enough behind current toolchains
    # that "it builds locally" stopped predicting anything — three releases
    # failed here on concurrency diagnostics that a newer compiler accepts.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test the menu bar app
        # No Swift 6 language-mode check here: the runner's toolchain does not
        # accept -swift-version 6. `make macos-strict` runs it locally on a
        # toolchain that does. The runner's own compiler is the stricter of
        # the two for concurrency diagnostics, so this build is the real gate.
        run: |
          swift --version
          swift test --package-path macos/menubar
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build Baaz.dmg
        # Builds the app too: the bundle carries the baaz CLI, so the dmg is
        # the whole macOS install rather than an app plus a setup script.
        run: ./macos/make-dmg.sh build "${GITHUB_REF_NAME#v}"
      - name: Zip the app as well
        # ditto preserves the bundle's symlinks and the ad-hoc signature;
        # plain `zip` breaks both and the app will not launch.
        run: ditto -c -k --keepParent build/Baaz.app Baaz-macos.zip
      - name: Sign the update and generate the appcast
        # Sparkle refuses an update whose EdDSA signature does not match the
        # public key in Info.plist, which is what makes in-app updates safe
        # without an Apple Developer ID. Without the secret the release still
        # publishes — it just cannot be auto-updated to.
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY is not set — skipping the appcast, so in-app updates will not see this release"
            exit 0
          fi
          tools="$(find macos/menubar/.build/artifacts -type d -path '*sparkle*/bin' | head -1)"
          [ -n "$tools" ] || { echo "sparkle tools missing"; exit 1; }
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$keyfile"
          mkdir -p appcast-src
          cp Baaz-macos.zip appcast-src/
          "$tools/generate_appcast"             --ed-key-file "$keyfile"             --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"             appcast-src
          mv appcast-src/appcast.xml .
          echo "appcast:"; cat appcast.xml
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            build/Baaz.dmg
            Baaz-macos.zip
            appcast.xml
          if-no-files-found: warn

  release:
    needs: [build, macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            baaz-linux-amd64
            baaz-linux-arm64
            baaz-darwin-amd64
            baaz-darwin-arm64
            baaz-extension.zip
            Baaz.dmg
            Baaz-macos.zip
            appcast.xml
            install.sh

  aur:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point PKGBUILD at this tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          HASH=$(curl -sL "https://github.com/shahriyardx/baaz/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | sha256sum | cut -d' ' -f1)
          sed -i "s/^pkgver=.*/pkgver=${VER}/; s/^sha256sums=.*/sha256sums=('${HASH}')/" packaging/aur/PKGBUILD
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: baaz
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: shahriyardx
          commit_email: mdshahriyaralam552@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "baaz ${{ github.ref_name }}"
