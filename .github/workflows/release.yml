name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o baaz-linux-amd64 ./cmd/baaz
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o baaz-linux-arm64 ./cmd/baaz
      - name: Test
        run: go test ./internal/...
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            baaz-linux-amd64
            baaz-linux-arm64
            install.sh
