name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o baaz-linux-amd64 ./cmd/baaz
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o baaz-linux-arm64 ./cmd/baaz
      - name: Test
        run: go test ./internal/...
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            baaz-linux-amd64
            baaz-linux-arm64
            install.sh

  aur:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point PKGBUILD at this tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          HASH=$(curl -sL "https://github.com/shahriyardx/baaz/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | sha256sum | cut -d' ' -f1)
          sed -i "s/^pkgver=.*/pkgver=${VER}/; s/^sha256sums=.*/sha256sums=('${HASH}')/" packaging/aur/PKGBUILD
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: baaz
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: shahriyardx
          commit_email: mdshahriyaralam552@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "baaz ${{ github.ref_name }}"
