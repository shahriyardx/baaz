<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* A plain placeholder surface, not anyone's video: the screenshot shows
     our own button, and nothing whose rights belong to someone else. */
  .player {
    position: relative; width: 560px; aspect-ratio: 16/9; border-radius: 12px;
    background: linear-gradient(145deg, #1b2029, #10141b);
    border: 1px solid #262b34;
    box-shadow: 0 30px 70px rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
  }
  .play {
    width: 74px; height: 74px; border-radius: 50%;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
    display: flex; align-items: center; justify-content: center;
  }
  .play::after {
    content: ""; margin-left: 4px;
    border-left: 20px solid rgba(255,255,255,.34);
    border-top: 13px solid transparent; border-bottom: 13px solid transparent;
  }
  .scrub {
    position: absolute; left: 14px; right: 14px; bottom: 13px; height: 3px;
    border-radius: 2px; background: rgba(255,255,255,.14);
  }
  .scrub::after {
    content: ""; position: absolute; inset: 0 62% 0 0;
    border-radius: 2px; background: rgba(255,255,255,.4);
  }
  /* Exactly the styles content.js applies, so this is the real button. */
  .baaz-wrap { position: absolute; right: 14px; top: 14px; transform: scale(1.34); transform-origin: top right; }
  .baaz-btn {
    display: flex; align-items: center; gap: 6px; padding: 6px 11px;
    background: rgba(12,14,18,.72); backdrop-filter: blur(14px) saturate(140%);
    color: #fff; font-size: 12px; font-weight: 560; letter-spacing: -.01em;
    line-height: 1; border-radius: 8px; border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 4px 14px rgba(0,0,0,.34); transform: translateY(-1px);
  }
  .baaz-menu {
    position: absolute; right: 0; top: calc(100% + 6px); min-width: 164px;
    background: rgba(14,17,22,.94); backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.05) inset;
    padding: 4px;
  }
  .baaz-menu div {
    padding: 7px 10px; color: rgba(255,255,255,.88); font-size: 12px;
    font-weight: 500; letter-spacing: -.01em; border-radius: 6px;
  }
  .baaz-menu div.on { background: rgba(79,140,255,.9); color: #fff; }
</style></head><body>
<div class="copy">
  <svg class="mark" viewBox="0 0 128 128" fill="currentColor">
    <path d="M62 34C48 42 34 45 20 42c10 15 27 22 39 24l3-8Z"/>
    <path d="M66 34c14 8 28 11 42 8-10 15-27 22-39 24l-3-8Z"/>
    <path d="M64 30l9 32-9 40-9-40Z"/><rect x="38" y="106" width="52" height="7" rx="3.5"/>
  </svg>
  <h1>Any video,<br><em>one click</em></h1>
  <p>Hover a video and the Download button appears. Pick a quality, or take the audio on its own as an mp3.</p>
</div>
<div class="stage"><div class="player">
  <div class="play"></div><div class="scrub"></div>
  <div class="baaz-wrap">
    <div class="baaz-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span>Download</span>
    </div>
    <div class="baaz-menu">
      <div>Best quality</div><div class="on">1080p</div><div>720p</div>
      <div>480p</div><div>Audio only &middot; mp3</div>
    </div>
  </div>
</div></div>
</body></html>
