<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* One accent, two greys, and space. The popup has exactly one job —
     turn takeover on or off — so everything else is kept quiet. */
  :root {
    color-scheme: dark;
    --bg: #101216;
    --surface: #171a20;
    --surface-hi: #1e222a;
    --border: #262b34;
    --text: #e9ecf1;
    --muted: #868e9c;
    --faint: #5b626e;
    --accent: #4f8cff;
    --ok: #32d583;
    --bad: #f97066;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --surface: #f7f8fa;
      --surface-hi: #f0f2f5;
      --border: #e4e7ec;
      --text: #12151a;
      --muted: #667085;
      --faint: #98a2b3;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 300px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 16px;
  }

  header { display: flex; align-items: center; gap: 9px; margin-bottom: 16px; }
  .mark { width: 22px; height: 22px; flex: none; color: var(--accent); }
  .name { font-size: 15px; font-weight: 650; letter-spacing: -.2px; }
  .ver { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  header .spacer { flex: 1; }

  /* Status reads as one quiet line, not a box competing with the card. */
  .status { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--faint);
    box-shadow: 0 0 0 3px transparent; transition: background .2s, box-shadow .2s;
  }
  .dot.up { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
  .dot.busy { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .dot.down { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 18%, transparent); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px;
    display: flex; align-items: center; gap: 12px;
    transition: background .15s, border-color .15s;
  }
  .card:hover { background: var(--surface-hi); }
  .card .text { flex: 1; min-width: 0; }
  .card .label { font-weight: 550; font-size: 13px; letter-spacing: -.1px; }
  .card .sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

  .switch { position: relative; width: 40px; height: 23px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .slider {
    position: absolute; inset: 0; pointer-events: none;
    background: var(--border); border-radius: 99px;
    transition: background .18s cubic-bezier(.4,0,.2,1);
  }
  .slider::before {
    content: ""; position: absolute; width: 17px; height: 17px;
    left: 3px; top: 3px; background: #fff; border-radius: 50%;
    box-shadow: 0 1px 3px rgba(0,0,0,.28);
    transition: transform .18s cubic-bezier(.4,0,.2,1);
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(17px); }
  .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Only present while something is downloading, so the popup stays calm
     the rest of the time. */
  .live {
    display: none; align-items: center; gap: 7px;
    margin-top: 12px; padding: 10px 12px;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
    border-radius: 10px; font-size: 12px;
  }
  .live.show { display: flex; }

  .getapp {
    display: none; align-items: center; gap: 10px;
    margin-top: 12px; padding: 11px 12px;
    background: color-mix(in srgb, var(--bad) 9%, transparent);
    border: 1px solid color-mix(in srgb, var(--bad) 24%, transparent);
    border-radius: 10px;
    color: inherit; text-decoration: none;
    transition: background .15s;
  }
  .getapp.show { display: flex; }
  .getapp:hover { background: color-mix(in srgb, var(--bad) 15%, transparent); }
  .getapp-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .getapp strong { font-size: 12.5px; font-weight: 600; }
  .getapp span { font-size: 11.5px; color: var(--muted); }
  .getapp svg { width: 14px; height: 14px; flex: none; color: var(--muted); }
  .live .count { font-weight: 650; font-variant-numeric: tabular-nums; }
  .live .arrow { width: 13px; height: 13px; color: var(--accent); flex: none; }

</style>
</head>
<body>
  <header>
    <!-- The same falcon as the app icon, so the two read as one product. -->
    <svg class="mark" viewBox="0 0 128 128" fill="currentColor" aria-hidden="true">
      <path d="M62 34C48 42 34 45 20 42c10 15 27 22 39 24l3-8Z"/>
      <path d="M66 34c14 8 28 11 42 8-10 15-27 22-39 24l-3-8Z"/>
      <path d="M64 30l9 32-9 40-9-40Z"/>
      <rect x="38" y="106" width="52" height="7" rx="3.5"/>
    </svg>
    <span class="name">Baaz</span>
    <span class="ver" id="version"></span>
    <span class="spacer"></span>
    <span class="status"><span class="dot" id="dot"></span><span id="statusText">checking…</span></span>
  </header>

  <div class="card">
    <div class="text">
      <div class="label">Take over downloads</div>
      <div class="sub" id="cardSub">Chrome hands files to Baaz</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="enabled" aria-label="Take over downloads">
      <span class="slider"></span>
    </label>
  </div>

  <!-- Someone can install this from the store without the app. Say so, and
       give them somewhere to go, instead of a dead "not running". -->
  <a class="getapp" id="getapp"
     href="https://github.com/shahriyardx/baaz#install" target="_blank" rel="noopener">
    <span class="getapp-text">
      <strong>Baaz app not found</strong>
      <span>The extension needs the free app to do the downloading.</span>
    </span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M7 17 17 7"/><path d="M8 7h9v9"/>
    </svg>
  </a>

  <div class="live" id="live">
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/>
    </svg>
    <span><span class="count" id="activeCount">0</span> downloading</span>
  </div>

  <script>
document.getElementById("version").textContent="v" + "0.1.6";
document.getElementById("enabled").checked=true;
document.getElementById("dot").className="dot busy";
document.getElementById("statusText").textContent="connected";
document.getElementById("activeCount").textContent="3";
document.getElementById("live").classList.add("show");
</script>
</body>
</html>
